name: Publish Sai Bank App

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: publish-sai-bank-app
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Sai Bank App
        uses: actions/checkout@v4
        with:
          repository: pallasivasai/Sai_Bank_App
          path: bank-app-source
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Sai Bank App
        working-directory: bank-app-source
        run: gradle jsBrowserProductionWebpack --no-daemon

      - name: Publish generated app
        run: |
          rm -rf Sai_Bank_App
          mkdir -p Sai_Bank_App
          cp -R bank-app-source/build/distributions/. Sai_Bank_App/
          touch Sai_Bank_App/.nojekyll
          rm -rf bank-app-source

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Sai_Bank_App
          if git diff --cached --quiet; then
            echo 'No changes to publish.'
          else
            git commit -m 'Publish latest Sai Bank App'
            git push
          fi
