name: Deploy SAI Voice OS

on:
  push:
    branches: [main]
    paths:
      - "Sai_OS/**"
      - ".github/workflows/deploy-sai-os.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sai-voice-os-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Sai_OS

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.4"

      - name: Build Kotlin/Wasm
        run: gradle :webApp:wasmJsBrowserDistribution --no-daemon

      - name: Prepare GitHub Pages site
        working-directory: .
        run: |
          rm -rf pages
          mkdir -p pages/Sai_OS
          cp -R Sai_OS/webApp/build/dist/wasmJs/productionExecutable/. pages/Sai_OS/
          test -s pages/Sai_OS/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
