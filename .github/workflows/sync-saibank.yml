name: Sync Sai Bank App

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-saibank.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout SaiBank source
        uses: actions/checkout@v4
        with:
          repository: pallasivasai/saibank
          path: saibank-source
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: saibank-source/package-lock.json

      - name: Configure GitHub Pages base path
        working-directory: saibank-source
        run: |
          python - <<'PY'
          from pathlib import Path

          vite = Path('vite.config.ts')
          text = vite.read_text()
          if 'base:' not in text:
              text = text.replace('export default defineConfig(({ mode }) => ({', "export default defineConfig(({ mode }) => ({\n  base: '/Sai_Bank_App/',")
          vite.write_text(text)

          app = Path('src/App.tsx')
          text = app.read_text()
          text = text.replace('<BrowserRouter>', '<BrowserRouter basename="/Sai_Bank_App">')
          app.write_text(text)
          PY

      - name: Install dependencies
        working-directory: saibank-source
        run: npm ci

      - name: Build production app
        working-directory: saibank-source
        run: npm run build

      - name: Publish source and production build
        run: |
          rm -rf Sai_Bank_App
          mkdir -p Sai_Bank_App/source

          cp -R saibank-source/dist/. Sai_Bank_App/

          rsync -a --exclude='.git' --exclude='.env' --exclude='node_modules' --exclude='dist' saibank-source/ Sai_Bank_App/source/

          cp saibank-source/README.md Sai_Bank_App/README.md
          touch Sai_Bank_App/.nojekyll
          rm -rf saibank-source

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Sai_Bank_App
          if git diff --cached --quiet; then
            echo 'No changes to publish.'
          else
            git commit -m 'Publish SaiBank app with full payment logic'
            git push origin main
          fi
